# Begin /boot/grub/grub.cfg

set default=0
set timeout=5

insmod part_gpt
insmod ext2
insmod fat
insmod efi_gop

menuentry "GNU/Linux, Linux 7.1.8-lfs" {
    search --no-floppy --label --set=root LFSROOT 
    linux /boot/vmlinuz-7.1.8-lfs root=/dev/vda2 rw console=ttyAMA0

}

menuentry "Debian" {
    insmod chain
    search --no-floppy --fs-uuid --set=root A695-91EA
    chainloader /EFI/debian/grubaa64.efi
}
